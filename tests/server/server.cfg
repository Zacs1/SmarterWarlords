// Dedicated server config for automated SmarterWarlords test rounds.
// Local test use only: LAN-only, passworded, no BattlEye so nothing is written to the server's battleye folder.

hostname = "SWL automated test";
password = "swl-test-local";
passwordAdmin = "swl-test-local-admin";
maxPlayers = 16;

persistent = 1;
BattlEye = 0;
verifySignatures = 0;
kickDuplicate = 0;
disableVoN = 1;
loopback = 1;
upnp = 0;
timeStampFormat = "short";

headlessClients[] = {"127.0.0.1"};
localClient[] = {"127.0.0.1"};

class Missions
{
	class SWLTest
	{
		template = "SWL_Test.Tanoa";
		difficulty = "Regular";
		class Params
		{
@PARAMS@
		};
	};
};
